<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>카운터</title>
<style>
  body { font-family: sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; margin: 0; background: #f4f4f8; }
  #count { font-size: 6rem; margin: 1rem 0; }
  .buttons { display: flex; gap: 12px; }
  button { font-size: 1.5rem; padding: 0.5rem 1.5rem; border: none; border-radius: 8px; cursor: pointer; background: #4f6df5; color: #fff; }
  button:hover { background: #3b56d9; }
  #reset { background: #888; }
</style>
</head>
<body>
  <h1>카운터</h1>
  <div id="count">0</div>
  <div class="buttons">
    <button id="dec">-2</button>
    <button id="reset">초기화</button>
    <button id="inc">+2</button>
  </div>
<script>
  const STEP = 2;
  let n = 0;
  const el = document.getElementById('count');
  const render = () => el.textContent = n;
  document.getElementById('inc').onclick = () => { n += STEP; render(); };
  document.getElementById('dec').onclick = () => { n -= STEP; render(); };
  document.getElementById('reset').onclick = () => { n = 0; render(); };
</script>
</body>
</html>
